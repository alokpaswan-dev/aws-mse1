<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="registerHeading">Event Registration</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Registration</a>
    </nav>
  </header>

  <main>
    <p class="intro">Fill in your details to register for a college event.</p>
    <div class="buttons">
      <button onclick="changeRegisterSize()">Change Heading Size</button>
      <button onclick="toggleForm()">Show / Hide Form</button>
    </div>

    <form id="registrationForm" class="registration-form">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="Your name">

      <label for="rollNumber">Student Roll Number</label>
      <input type="text" id="rollNumber" placeholder="Your roll number">

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com">

      <label for="eventSelect">Choose Event</label>
      <select id="eventSelect">
        <option value="">Select an event</option>
        <option>Tech Fest</option>
        <option>Sports Day</option>
        <option>Cultural Night</option>
        <option>Art Competition</option>
      </select>

      <button type="button" onclick="registerStudent()">Register</button>
    </form>
    <p id="registrationMessage"></p>
  </main>
  <footer>Campus Event Management</footer>
  <script src="script.js"></script>
</body>
</html>
